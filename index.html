<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>알고리즘 탐험대</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fffaf0;--card:#fff;--ink:#2b2a33;--sub:#6b6a76;--pri:#4f6df5;--pri-ink:#fff;--ok:#1f9d55;--okbg:#e3f6ea;--no:#d6453d;--nobg:#fde8e6;--line:#e2dccb;--soft:#eef1ff;--code:#1f2233;--codeink:#e8ecff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171d;--card:#22222b;--ink:#f1f0f5;--sub:#a5a4b3;--pri:#7c93ff;--pri-ink:#12131a;--ok:#5fd18b;--okbg:#17352a;--no:#ff857d;--nobg:#3b1f1e;--line:#383846;--soft:#2a2d45;--code:#10111a;--codeink:#e8ecff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17171d;--card:#22222b;--ink:#f1f0f5;--sub:#a5a4b3;--pri:#7c93ff;--pri-ink:#12131a;--ok:#5fd18b;--okbg:#17352a;--no:#ff857d;--nobg:#3b1f1e;--line:#383846;--soft:#2a2d45;--code:#10111a;--codeink:#e8ecff;color-scheme:dark}
*{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:18px;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:4px 0 12px}
h2{font-size:21px;margin:0 0 8px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{flex:1 1 150px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px;font:inherit;font-size:16px;cursor:pointer;font-weight:700}
.tab.on{border-color:var(--pri);background:var(--soft)}
.tab.done::after{content:" ✅"}
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px}
.q{background:var(--soft);border-radius:12px;padding:10px 14px;margin:8px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.box{border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--card)}
.box h3{margin:0 0 6px;font-size:17px;color:var(--pri)}
.box p.d{margin:0 0 8px;font-size:15px;color:var(--sub)}
pre.code{background:var(--code);color:var(--codeink);border-radius:10px;padding:12px;margin:0;font:16px/1.7 "D2Coding",ui-monospace,Menlo,monospace;white-space:pre-wrap;overflow-x:auto}
.nl{margin:0;padding-left:22px}
.box svg{width:100%;height:auto;max-width:320px;display:block;margin:0 auto}
svg text{font-family:inherit;font-size:13px;fill:var(--ink);text-anchor:middle}
svg .n{fill:var(--card);stroke:var(--pri);stroke-width:2}
svg .o{fill:var(--soft);stroke:var(--pri);stroke-width:2}
svg .dm{fill:#fff6d6;stroke:#d9a400;stroke-width:2}
@media (prefers-color-scheme:dark){svg .dm{fill:#443a14}}
svg .ln{stroke:var(--sub);stroke-width:2;fill:none}
svg .lb{font-size:12px;fill:var(--sub)}
button.btn{background:var(--pri);color:var(--pri-ink);border:0;border-radius:12px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer;margin:6px 6px 0 0}
button.btn.ghost{background:var(--soft);color:var(--ink)}
select{font:inherit;font-size:17px;padding:4px 8px;border-radius:8px;border:2px solid var(--pri);background:var(--card);color:var(--ink)}
.fb{margin-top:10px;display:grid;gap:6px}
.fb div{padding:8px 12px;border-radius:10px;font-size:16px}
.fb .ok{background:var(--okbg);color:var(--ok)}
.fb .no{background:var(--nobg);color:var(--no)}
.lbl{font-weight:700;margin:12px 0 6px;font-size:16px;color:var(--sub)}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:48px}
.card{border:2px dashed var(--pri);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 12px;font:inherit;font-size:16px;cursor:pointer;text-align:left}
.card:hover{background:var(--soft)}
ol.ans{list-style:none;margin:0;padding:10px;border:2px solid var(--line);border-radius:12px;min-height:60px;counter-reset:s;background:var(--bg)}
ol.ans li{counter-increment:s;display:flex;gap:8px;align-items:center;background:var(--card);border:2px solid var(--pri);border-radius:10px;padding:6px 10px;margin:6px 0;font-size:16px}
ol.ans li::before{content:counter(s);background:var(--pri);color:var(--pri-ink);border-radius:50%;min-width:26px;height:26px;display:grid;place-items:center;font-weight:700;font-size:14px}
ol.ans li span{flex:1}
ol.ans li button{border:0;background:var(--soft);color:var(--ink);border-radius:8px;width:34px;height:34px;font-size:16px;cursor:pointer}
.mini{display:flex;gap:6px;margin:12px 0 6px}
.mini button{flex:1;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px;font:inherit;font-size:15px;cursor:pointer}
.mini button.on{border-color:var(--pri);background:var(--soft);font-weight:700}
.trace{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:8px;font-size:16px}
.hint{font-size:15px;color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
<h1>🧩 알고리즘 탐험대</h1>
<div class="bd2" id="board"><div class="bh"><b>📋 진행 상황판</b><input id="nm" placeholder="이름" aria-label="이름"><span class="bs" id="bs"></span><button class="rsb" id="rsall">↺ 처음부터</button></div><div class="bdg" id="bdg"></div><div id="bg"></div><div class="hint" style="margin-top:6px;font-size:13px">✅ 정답 · ❌ 틀린 채로 확인함 · ⬜ 아직 안 함</div></div>
<div class="tabs" id="tabs"></div>
<div class="panel" id="main"></div>
<div id="toast" role="status" aria-live="polite"></div><div class="qm" id="qm" hidden></div>
</div>
<style>.shp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:10px 0}.shp>div{border:2px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-size:14px;line-height:1.4}.shp svg{width:100%;max-width:130px;height:auto}.nl .nl{font-size:15px}.f{margin-top:8px}.tab:disabled,.mini button:disabled{opacity:.45;cursor:not-allowed}.bd2{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:12px}.bh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.bh input{font:inherit;font-size:15px;padding:3px 8px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:110px}.bh .bs{margin-left:auto;font-weight:700;font-size:15px}.br{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}.bn{font-size:13px;font-weight:700;min-width:84px}.c{font-size:12px;border-radius:8px;padding:2px 7px;border:1.5px solid var(--line);background:var(--bg);color:var(--sub)}.c.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.c.sk{background:#fff3cd;border-color:#d9a400;color:#8a6500}.c.bad{background:var(--nobg);border-color:var(--no);color:var(--no)}.c.cur{outline:2px solid var(--pri)}@media (prefers-color-scheme:dark){.c.sk{background:#4a3d10;color:#ffd666}}
body{font-size:21px;line-height:1.65}.wrap{max-width:1000px;padding:20px}h1{font-size:32px}h2{font-size:26px}
.tab{font-size:19px;padding:14px 10px;min-height:58px;border-radius:16px}
button.btn{font-size:21px;padding:14px 28px;min-height:56px;border-radius:16px;margin:10px 10px 0 0}
select{font-size:20px;padding:8px 12px;min-height:52px;border-radius:12px;margin:2px 0}
.card{font-size:20px;padding:13px 18px;min-height:56px;border-radius:14px}
ol.ans li{font-size:20px;padding:8px 12px;gap:10px}ol.ans li button{width:50px;height:50px;font-size:22px;border-radius:12px}ol.ans li::before{min-width:34px;height:34px;font-size:17px}
.mini button{font-size:18px;padding:12px 8px;min-height:54px;border-radius:12px}
.q{font-size:20px;padding:14px 18px}.fb div{font-size:20px;padding:12px 16px}
pre.code{font-size:20px;padding:14px}.box{padding:16px}.box h3{font-size:21px}.box p.d{font-size:18px}.hint{font-size:18px}.lbl{font-size:19px}
.shp>div{font-size:17px}.grid{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.box svg{max-width:480px}
.bd2{padding:12px 14px}.bn{font-size:16px;min-width:100px}.c{font-size:15px;padding:4px 10px}.bh b{font-size:19px}.bh input{font-size:19px;width:140px;padding:5px 10px}.bh .bs{font-size:19px}.bd2 .hint{font-size:15px!important}
.wrap{max-width:1180px}.rsb{font:inherit;font-size:15px;border:2px solid var(--line);background:var(--bg);color:var(--sub);border-radius:10px;padding:5px 12px;cursor:pointer;min-height:44px}
.split{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
.split .side{position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto;border:2px solid var(--line);border-radius:16px;padding:12px;background:var(--card)}
.split .side .box{border:0;padding:0}.split .side .lbl{margin-top:0}.split .side svg{max-width:100%}
.split ol.ans li button{width:44px;height:44px}
.bn{min-width:150px}
.pot{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.pot svg{flex:0 0 240px;width:240px;max-width:240px;margin:0}.pot ol{flex:1 1 240px;margin:0;padding:0;list-style:none;font-size:19px;line-height:1.5}.pot li{margin:7px 0}.pot li b{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--pri);color:var(--pri-ink);font-size:16px;margin-right:9px;vertical-align:middle}
.qh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--soft);border-radius:14px;padding:10px 16px;margin-bottom:10px}.qh b{font-size:21px}.qh .pb{flex:1 1 140px;height:14px;background:var(--bg);border-radius:8px;overflow:hidden;border:2px solid var(--line)}.qh .pb i{display:block;height:100%;background:var(--ok);transition:width .5s}
.bdg{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}.bdg .m{font-size:15px;border-radius:20px;padding:4px 12px;border:2px solid var(--line);opacity:.4;filter:grayscale(1);background:var(--bg)}.bdg .m.on{opacity:1;filter:none;border-color:var(--ok);background:var(--okbg);font-weight:700}.bdg .xp{margin-left:auto;font-weight:700;font-size:16px}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,40px);background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:30px;font-size:20px;font-weight:700;opacity:0;pointer-events:none;transition:all .3s;z-index:50;max-width:92vw;text-align:center}#toast.on{opacity:1;transform:translate(-50%,0)}
.qm{position:fixed;inset:0;background:rgba(20,20,40,.6);display:grid;place-items:center;z-index:60;padding:16px;overflow:hidden}.qm[hidden]{display:none}
.qc{background:var(--card);border:4px solid var(--pri);border-radius:28px;padding:28px 32px;max-width:480px;text-align:center;position:relative;z-index:2;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}.qc .big{font-size:84px;line-height:1.1}.qc h2{font-size:34px;margin:6px 0}.qc p{margin:8px 0}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.cf{position:absolute;top:-40px;font-size:30px;animation:fall linear forwards;z-index:1}@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.cf{display:none}.qc{animation:none}}
@media (max-width:900px){.split{grid-template-columns:1fr}.split .side{position:static;max-height:none}}
</style>
<script>
const $=s=>document.querySelector(s);
const ck=(t,n)=>{const r=[];for(let i=0;i<t.length;i+=n)r.push(t.slice(i,i+n));return r};
const wrap=(t,n)=>{const r=[];let c='';t.split(' ').forEach(x=>{if(!c)c=x;else if((c+' '+x).length<=n)c+=' '+x;else{r.push(c);c=x}});if(c)r.push(c);return r.flatMap(l=>l.length>n+1?ck(l,n):[l])};
const txt=(L,x,y,h)=>L.map((l,i)=>`<text x="${x}" y="${y+h/2-(L.length-1)*8+i*16+4}">${l}</text>`).join('');
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fb=l=>{if(l.some(x=>!x[0]))markFail();return '<div class="fb">'+l.map(([o,m])=>`<div class="${o?'ok':'no'}">${o?'✅':'🤔'} ${m}</div>`).join('')+'</div>'};

const BD=[[1,204,204],[2,152,196],[3,120,142],[4,172,50],[5,90,262],[6,34,240],[7,206,240]].map(([n,x,y])=>`<circle cx='${x}' cy='${y}' r='12' fill='#4f6df5'/><text x='${x}' y='${y+5}' style='fill:#fff;font-size:14px;font-weight:700'>${n}</text>`).join('');
const POT=`<div class="box" style="margin:0 auto 10px"><h3>완성된 반자동 급수 화분 (교과서 93쪽)</h3><div class="pot"><svg viewBox='0 0 240 300' role='img' aria-label='반자동 급수 화분 완성 그림'><rect x='60' y='200' width='120' height='82' rx='8' fill='none' stroke='#8a8a99' stroke-width='2.5'/><rect x='62' y='228' width='116' height='52' rx='6' fill='#bfe3ff'/><polygon points='65,105 175,105 137,176 103,176' fill='none' stroke='#8a8a99' stroke-width='2.5'/><polygon points='68,118 172,118 136,172 104,172' fill='#8b5e3c'/><rect x='108' y='176' width='24' height='40' fill='none' stroke='#8a8a99' stroke-width='2.5'/><rect x='101' y='172' width='38' height='8' rx='2' fill='#4aa3df'/><rect x='110' y='180' width='7' height='68' fill='#f0a830'/><rect x='123' y='180' width='7' height='62' fill='#e8962a'/><path d='M120 118V62' stroke='#3b9b4a' stroke-width='4'/><ellipse cx='98' cy='72' rx='20' ry='9' transform='rotate(-30 98 72)' fill='#4cb85c'/><ellipse cx='143' cy='68' rx='20' ry='9' transform='rotate(30 143 68)' fill='#4cb85c'/><ellipse cx='120' cy='52' rx='9' ry='18' fill='#5ccb6c'/><path stroke='#8a8a99' stroke-width='1.5' stroke-dasharray='3 3' d='M181 204L192 204M133 196L140 196M60 240L46 240M180 240L194 240'/>${BD}</svg><ol><li><b>1</b>페트병을 반으로 자르기</li><li><b>2</b>심지 역할을 할 천을 길게 잘라 입구에 끼우기</li><li><b>3</b>위쪽 페트병에 배양토 채우기</li><li><b>4</b>식물을 옮겨 심기</li><li><b>5</b>아래쪽 페트병에 물을 채우고 위쪽을 올려놓기</li><li><b>6</b>주기적으로 물의 양 확인하기</li><li><b>7</b>물이 부족하면 물 보충하기</li></ol></div></div>`;
const rd=(el,pass)=>{el.insertAdjacentHTML('beforeend','<button class="btn" id="rd">다 읽었어요 ✔</button>');el.querySelector('#rd').onclick=pass};
/* ===== 알고리즘 표현 변환: 노드 → 자연어 / 의사코드 / 순서도 ===== */
// s: 처리 {x,f} / l: 반복 {x,b} / i: 선택 {q,c,y,n}
const nl=ns=>'<ol class="nl">'+ns.map(n=>n.t==='s'?`<li>${n.x}</li>`:n.t==='l'||n.t==='w'?`<li>${n.x}${nl(n.b)}</li>`:`<li>${n.c}${nl(n.y)}${n.n?'그렇지 않으면'+nl(n.n):''}</li>`).join('')+'</ol>';
const pcl=(ns,d)=>{const p='  '.repeat(d),r=[];ns.forEach(n=>{if(n.t==='s')r.push(p+n.x);else if(n.t==='l'||n.t==='w')r.push(p+n.x,...pcl(n.b,d+1));else{r.push(p+n.c,...pcl(n.y,d+1));if(n.n)r.push(p+'그렇지 않으면',...pcl(n.n,d+1))}});return r};
const pcOf=(ns,t)=>'<pre class="code">'+[t,...pcl(ns,1)].join('\n')+'</pre>';
function fcOf(ns){
 let o='';const W=380,cx=190,Lc=75,Rc=305,BW=100,MW=190,LX=14,EX=366;
 const hd=(x,y,d)=>o+=`<path class="ln" d="${d==='r'?`M${x-8} ${y-5}L${x} ${y}L${x-8} ${y+5}`:`M${x-5} ${y-8}L${x} ${y}L${x+5} ${y-8}`}"/>`;
 const ar=(x,a,b)=>{o+=`<path class="ln" d="M${x} ${a}V${b}"/>`;hd(x,b)};
 const box=(t,x,y,w)=>{const L=wrap(t,w>150?14:8),h=16*L.length+18;o+=`<rect class="n" x="${x-w/2}" y="${y}" width="${w}" height="${h}" rx="8"/>${txt(L,x,y,h)}`;return h};
 const dia=(q,x,y)=>o+=`<polygon class="dm" points="${x},${y} ${x+95},${y+35} ${x},${y+70} ${x-95},${y+35}"/>${txt(wrap(q,9),x,y,70)}`;
 const oval=(t,y)=>o+=`<rect class="o" x="${cx-50}" y="${y}" width="100" height="34" rx="17"/>${txt([t],cx,y,34)}`;
 function lay(ns,y,x,w){let b=y;
  ns.forEach((n,k)=>{
   if(k){ar(x,b,b+20);b+=20}
   if(n.t==='s')b+=box(n.f||n.x,x,b,w);
   else if(n.t==='l'){const t=b;ar(x,b,b+18);const y0=b+18,e=lay(n.b,y0,x,w),f=e+14,ex=x-w/2-1;
    o+=`<path class="ln" d="M${x} ${e}V${f}H${LX}V${y0+17}H${ex}"/>`;hd(ex,y0+17,'r');
    o+=`<rect x="3" y="${t}" width="${W-6}" height="${f+10-t}" rx="10" fill="none" stroke="var(--pri)" stroke-dasharray="5 4"/><text class="lb" x="30" y="${t+14}">반복</text>`;b=f+10}
   else if(n.t==='w'){const cy=b+35;dia(n.q,x,b);o+=`<text class="lb" x="${x+16}" y="${b+88}">예</text>`;ar(x,b+70,b+92);
    const e=lay(n.b,b+92,x,w),f=e+18,m=f+26;
    o+=`<path class="ln" d="M${x} ${e}V${f}H${LX}V${cy}H${x-95}"/>`;hd(x-95,cy,'r');
    o+=`<path class="ln" d="M${x+95} ${cy}H${EX}V${m}H${x}"/><text class="lb" x="${x+130}" y="${cy-6}">아니오</text>`;
    o+=`<rect x="3" y="${b-8}" width="${W-6}" height="${f-b+16}" rx="10" fill="none" stroke="var(--pri)" stroke-dasharray="5 4"/><text class="lb" x="30" y="${b+6}">반복</text>`;b=m}
   else{const cy=b+35,yb=cy+22;
    dia(n.q,x,b);o+=`<path class="ln" d="M${x+95} ${cy}H${Rc}V${yb}"/>`;hd(Rc,yb);o+=`<text class="lb" x="${x+108}" y="${cy-6}">예</text>`;
    const er=lay(n.y,yb,Rc,BW);let el=0;
    if(n.n){o+=`<path class="ln" d="M${x-95} ${cy}H${Lc}V${yb}"/>`;hd(Lc,yb);o+=`<text class="lb" x="${x-108}" y="${cy-6}">아니오</text>`;el=lay(n.n,yb,Lc,BW)}
    const m=Math.max(er,el,b+70)+16;o+=`<path class="ln" d="M${Rc} ${er}V${m}H${x}"/>`;
    o+=n.n?`<path class="ln" d="M${Lc} ${el}V${m}H${x}"/>`:`<path class="ln" d="M${x} ${b+70}V${m}"/><text class="lb" x="${x+26}" y="${b+86}">아니오</text>`;b=m}
  });return b}
 oval('시작',8);ar(cx,42,62);let y=lay(ns,62,cx,MW);

function save(){try{localStorage.setItem(SKEY,JSON.stringify({dn,sk,wr,ST,att,star,qd,st,pg,nm:$('#nm').value}))}catch(e){}}
function load(){try{const j=JSON.parse(localStorage.getItem(SKEY)||'null');if(!j)return;[['dn',dn],['sk',sk],['wr',wr],['ST',ST],['att',att],['star',star],['qd',qd]].forEach(([k,o])=>Object.assign(o,j[k]||{}));Object.keys(dn).forEach(k=>{if(!star[k])star[k]=2});S.forEach((_,i)=>{if(ok(i))qd[i]=1});if(j.nm)$('#nm').value=j.nm;if(Number.isInteger(j.st)&&S[j.st]&&Number.isInteger(j.pg)&&S[j.st][j.pg]&&open(j.st,j.pg)){st=j.st;pg=j.pg}}catch(e){}}
let showSkip=()=>{};function markFail(){const k=K();delete dn[k];wr[k]=1;att[k]=(att[k]||0)+1;nav();showSkip();toast('아쉬워요! 힌트를 읽고 다시 도전해 봐요 💪')}
const ok=s=>S[s].every((_,p)=>dn[s+'-'+p]);
const dd=(s,p)=>dn[s+'-'+p]||sk[s+'-'+p];
const open=()=>true;
const QN=[{e:'🪴',n:'화분 마법사',d:'자연어로 알고리즘 쓰기'},{e:'📜',n:'코드 해독가',d:'의사코드 읽고 쓰기'},{e:'🗺️',n:'길 안내 탐험가',d:'순서도 그리기'},{e:'🧹',n:'교실 청소 대장',d:'내 알고리즘 만들기'}];
const stars=s=>S[s].reduce((a,_,p)=>a+(star[s+'-'+p]||0),0),totS=()=>S.reduce((a,_,s)=>a+stars(s),0),maxS=()=>S.reduce((a,pp)=>a+pp.length*3,0);
const lvl=t=>t>=44?'👑 알고리즘 박사':t>=30?'🚀 알고리즘 대장':t>=15?'🧭 탐험가':t>=5?'🐣 견습 탐험가':'🥚 탐험 새싹';
let tt=0;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2300)}
function quest(s){const all=S.every((_,i)=>qd[i]),q=QN[s],m=$('#qm'),nx=S.findIndex((_,i)=>!qd[i]);
 m.innerHTML=`<div class="qc"><div class="big">${all?'🏆':q.e}</div><h2>${all?'모든 퀘스트 완료!':'퀘스트 완료!'}</h2><p><b>${q.e} 퀘스트 ${s+1}: ${q.n}</b><br>${all?'알고리즘 탐험을 모두 마쳤어요!':'“'+q.d+'” 배지를 얻었어요!'}</p><p>⭐ 이 퀘스트 ${stars(s)} / ${S[s].length*3} · 전체 ${totS()} / ${maxS()}<br><b>${lvl(totS())}</b></p>${nx>=0?'<button class="btn" id="qn">다음 퀘스트로 ▶</button>':''}<button class="btn ghost" id="qx">닫기</button></div>`+Array.from({length:26},()=>`<span class="cf" style="left:${Math.random()*100}%;animation-duration:${2.2+Math.random()*2.4}s;animation-delay:${Math.random()*.9}s">${['🎉','⭐','✨','🎊','🌟'][Math.floor(Math.random()*5)]}</span>`).join('');
 m.hidden=false;const x=()=>{m.hidden=true};$('#qx').onclick=x;const n=$('#qn');if(n)n.onclick=()=>{x();st=nx;pg=0;show();scrollTo(0,0)}}
function board(){$('#bdg').innerHTML=QN.map((q,i)=>`<span class="m ${qd[i]?'on':''}">${q.e} ${q.n}</span>`).join('')+`<span class="xp">⭐ ${totS()} / ${maxS()} · ${lvl(totS())}</span>`;
 const qh=$('#qh');if(qh){const q=QN[st],c=S[st].filter((_,p)=>dn[st+'-'+p]).length;qh.innerHTML=`<b>${q.e} 퀘스트 ${st+1}: ${q.n}</b><span class="hint">${q.d}</span><span class="pb"><i style="width:${c/S[st].length*100}%"></i></span><b>${c}/${S[st].length}</b>${qd[st]?'<span>✅ 완료!</span>':''}`}
 let n=0,k=0,w=0,tot=0;
 $('#bg').innerHTML=S.map((pp,s)=>`<div class="br"><span class="bn">${NM[s]}</span>${pp.map((_,p)=>{tot++;const y=s+'-'+p,d=dn[y],b=!d&&wr[y],x=0;if(d)n++;if(b)w++;if(x)k++;return `<span class="c ${d?'ok':b?'bad':x?'sk':''} ${s===st&&p===pg?'cur':''}">${d?'✅':b?'❌':x?'⏭':'⬜'} ${PNS[s][p]}</span>`}).join('')}</div>`).join('');
 $('#bs').innerHTML=n===tot?'🎉 모두 통과!':`통과 ${n}/${tot}${w?` · 틀림 ${w}`:''}${k?` · 건너뜀 ${k}`:''}`}
function nav(){board();save();$('#tabs').innerHTML=NM.map((n,i)=>`<button class="tab ${i===st?'on':''} ${ok(i)?'done':''}" data-s="${i}" ${open(i,0)?'':'disabled'}>${open(i,0)?'':'🔒 '}${n}</button>`).join('');
 $('#pn').innerHTML=S[st].length>1?S[st].map((_,p)=>`<button class="${p===pg?'on':''}" data-p="${p}" ${open(st,p)?'':'disabled'}>${open(st,p)?'':'🔒 '}${p+1}. ${PNS[st][p]}${dn[st+'-'+p]?' ✅':''}</button>`).join(''):''}
function show(){$('#main').innerHTML='<div class="qh" id="qh"></div><div class="mini" id="pn"></div><div id="pg"></div><div id="nxt"></div>';
 $('#pn').onclick=e=>{const b=e.target.closest('[data-p]');if(b){pg=+b.dataset.p;show()}};
 nav();
 const go=()=>{if(pg<S[st].length-1)pg++;else if(st<S.length-1){st++;pg=0}else return nav();show();scrollTo(0,0)};const key=st+'-'+pg;
 const skb=()=>{$('#nxt').innerHTML=''};showSkip=skb;skb();
 const fin=()=>{const first=!dn[key];dn[key]=1;delete sk[key];delete wr[key];let gain=0;if(first&&!star[key])gain=star[key]=Math.max(1,3-Math.min(2,att[key]||0));nav();
 if(first){if(gain)toast(`정답! ⭐ ${gain}개 획득`+(gain===3?' (한 번에 성공! 👏)':''));if(ok(st)&&!qd[st]){qd[st]=1;nav();setTimeout(()=>quest(st),700)}}
 const end=st===3&&pg===S[3].length-1;
  $('#nxt').innerHTML=end?'<div class="fb"><div class="ok">🎉 마지막 단계까지 마쳤어요! 위 상황판에서 ⬜(안 한 단계)나 ❌(틀린 단계)가 없는지 확인해요.</div></div>':'<button class="btn">다음 ▶</button>';
  const nb=$('#nxt button');if(nb)nb.onclick=go};
 S[st][pg]($('#pg'),fin);if(dn[st+'-'+pg])fin()}
$('#tabs').onclick=e=>{const b=e.target.closest('[data-s]');if(b){st=+b.dataset.s;pg=0;show()}};
load();$('#nm').oninput=save;
let rt=0;$('#rsall').onclick=function(){if(!rt){this.textContent='⚠ 정말 지울까요? 한 번 더';rt=setTimeout(()=>{rt=0;this.textContent='↺ 처음부터'},3500)}else{clearTimeout(rt);rt=0;try{localStorage.removeItem(SKEY)}catch(e){}location.reload()}};
show();
</script>
</body>
</html>
